name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install TeX and tools
        run: |
          brew install --cask basictex
          brew install poppler
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: TeX packages
        run: |
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
      - name: warm up TeX caches
        run: cd test/multifile && latexmk -lualatex -interaction=nonstopmode main.tex >/dev/null && latexmk -C
      - name: equivalence (editor and disk edits)
        env: { LTXP_TEST_SETTLE_MS: "15000" }
        run: |
          cd test
          node equivalence.mjs multifile main.tex chap.tex
          LTXP_TEST_DISK=1 node equivalence.mjs multifile main.tex chap.tex
          node equivalence.mjs sibling paper/main.tex sections/intro.tex
      - name: logs on failure
        if: failure()
        run: tail -n 40 "${TMPDIR:-/tmp}"/ltxp-eq-*/ltxp.err || true
      - name: keep test dirs on failure
        if: failure()
        run: mkdir -p eq && cp -R "${TMPDIR:-/tmp}"/ltxp-eq-* eq/ || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: equivalence-dirs
          path: eq
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install TeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: install the latest release with install.sh
        run: sh install.sh --no-editor
      - name: compile a document with the installed ltxp
        run: |
          export PATH="$HOME/.local/bin:$PATH" LTXP_PORT=47313
          ltxp test/multifile/main.tex 2> ltxp.err &
          curl -sN --retry 30 --retry-connrefused --retry-delay 1 --max-time 120 http://127.0.0.1:47313/events | grep -m1 '"kind":"done"'
          kill %1
      - name: logs on failure
        if: failure()
        run: cat ltxp.err || true
