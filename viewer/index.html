<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LaTeX preview</title>
<link rel="stylesheet" href="/pdf_viewer.css">
<style>
  body { margin: 0; background: #525659; font-family: sans-serif; }
  #status { position: fixed; top: 4px; right: 8px; z-index: 10; color: #ddd; font-size: 12px; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }
  .page { position: relative; background: white; box-shadow: 0 1px 4px #0006; }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .page .textLayer { cursor: default; }
  .marker { position: absolute; z-index: 5; pointer-events: none; }
  .marker.caret { width: 2px; background: #e33; animation: blink 1s 3; }
  .marker.box { background: #fd03; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="status">connecting</div>
<div id="pages"></div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
